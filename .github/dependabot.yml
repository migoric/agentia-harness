# 依赖更新自动化。
#
# 只有 github-actions 这一路能开：唯一的运行时依赖 `@migor/agentia` 写的是
# `file:../agentia`（本地并排检出），npm 生态的 updater 在解析清单时就会以
# `path_dependencies_not_reachable` 失败 —— 每周一次红叉，只会训练人忽略 CI 通知。
# 上游版本靠 CI 里那条并排 checkout 跟着走；devDependencies（biome / typescript /
# tsx / @types/node）按需手动升：
#
#   npx npm-check-updates -u && npm install && npm run check && npm run e2e:offline
#
# 别为了「省事」把它们钉成 `latest`：类型检查是硬门，跨大版本要单独一次提交，
# 这样真红了能一眼定位到「就是这次升级」。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
