# 依赖更新自动化。唯一的运行时依赖是 `@migor/agentia`，且写法是 `file:../agentia`
# —— 那是**本地并排检出**，dependabot 管不到也不该管；上游的版本跟进靠 CI 那条
# 并排 checkout（见 .github/workflows/ci.yml）。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # 把开发依赖合成一个 PR，避免每周被若干琐碎 PR 淹没
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'
