name: ci

on:
  push:
    branches: [main]
  pull_request:

# 连续推送时旧的那次跑完也没人看 —— 直接取消，省 runner 分钟也省噪音
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 只读：CI 不需要写仓库任何东西
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 依赖是 registry 上的版本区间（^0.10.12），不再需要并排 checkout 上游仓。
      # 这同时就是「发布的包能不能被外人装」的日常验证：CI 装的是别人装的那一份。
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run check

      # 真实客户端路径（fetch / SSE / 重试 / usage→成本）只有这一条能覆盖：
      # 单元测试里的 client 全是注入的，那一层代码本来只能靠读代码相信
      - name: 离线 e2e —— 用本地 wire 协议端点跑真实 HTTP 客户端
        run: npm run e2e:offline

      # 资产锁是新工程的绿线：示例工程能 init 出来且一开始就一致
      - name: 冒烟 —— init 出来的工程 lock --check 必须是绿的
        run: |
          tmp=$(mktemp -d)
          node dist/cli.js init "$tmp"
          node dist/cli.js lock --check --root "$tmp"
